name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Installs the Claude Code CLI ourselves via npm instead of letting the
      # action's built-in native installer do it. Works around
      # https://github.com/anthropics/claude-code-action/issues/1290 and
      # related reports, where that installer sometimes reports success
      # without actually placing the binary at ~/.local/bin/claude.
      - name: Install Claude Code CLI
        id: install_claude
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "claude_path=$(which claude)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.install_claude.outputs.claude_path }}
          # plugin_marketplaces / plugins removed on purpose: this exact
          # combination (plugin_marketplaces: https://github.com/anthropics/claude-code.git,
          # plugins: code-review@claude-code-plugins) currently triggers
          # https://github.com/anthropics/claude-code-action/issues/1290 -
          # the native binary install can silently fail and the marketplace
          # step then can't spawn claude. Re-add once that issue is closed.
          prompt: |
            Review this pull request (${{ github.repository }} #${{ github.event.pull_request.number }}) for code quality issues, potential bugs, security concerns, and style problems. Post your findings as inline comments on the specific changed lines where possible, and leave a brief summary comment.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
